<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NEURO</title>
</head>
<body>
    <script>
        const styles = document.createElement('style');
        styles.textContent = `
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        /* Контейнер приложения */
        #app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Страницы */
        .page {
            width: 100%;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0);
            visibility: visible;
            position: relative;
        }

        /* Карточка */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Заголовки с анимацией */
        h1 {
            font-size: 64px;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
            opacity: 0;
            transform: translateY(30px);
            }
            to {
            opacity: 1;
            transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInLeft {
            from {
            opacity: 0;
            transform: translateX(-50px);
            }
            to {
            opacity: 1;
            transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
            opacity: 0;
            transform: scale(0.9);
            }
            to {
            opacity: 1;
            transform: scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        h2 {
            font-size: 36px;
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        h3 {
            font-size: 24px;
            color: #c4b5fd;
            margin-bottom: 12px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        /* Инпуты с анимацией */
        .input-group {
            margin-bottom: 20px;
            animation: slideInLeft 0.5s ease both;
        }

        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Кнопки */
        .btn {
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 16px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #a78bfa;
        }

        /* Список преимуществ */
        .features {
            display: flex;
            gap: 24px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            animation: scaleIn 0.5s ease both;
        }

        .feature-item:nth-child(1) { animation-delay: 0.4s; }
        .feature-item:nth-child(2) { animation-delay: 0.5s; }
        .feature-item:nth-child(3) { animation-delay: 0.6s; }

        /* Навигация */
        .nav-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .back-link {
            color: #a78bfa;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            transform: translateX(-5px);
            color: #c4b5fd;
        }

        /* Анимация загрузки */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .card {
            padding: 32px 24px;
            }
            h1 {
            font-size: 40px;
            }
            h2 {
            font-size: 28px;
            }
        }
        `;

        document.head.appendChild(styles);

        // Роутер и управление страницами

        class NeuroApp {
        constructor() {
            this.currentUser = null;
            this.pages = {};
            this.init();
        }

        init() {
            this.createAppContainer();
            this.createPages();
            this.showPage('landing');
        }

        createAppContainer() {
            this.container = document.createElement('div');
            this.container.id = 'app';
            document.body.appendChild(this.container);
        }

        createPages() {
            // Лендинг страница
            this.pages.landing = this.createLandingPage();
            
            // Регистрация
            this.pages.register = this.createRegisterPage();
            
            // Логин
            this.pages.login = this.createLoginPage();
            
            // Создание плейлиста (основная страница)
            this.pages.create = this.createPlaylistPage();
            
            // Добавляем все страницы в контейнер
            Object.values(this.pages).forEach(page => {
            this.container.appendChild(page);
            });
        }

        createLandingPage() {
            const page = document.createElement('div');
            page.className = 'page';
            page.id = 'landing';
            
            page.innerHTML = `
            <div style="position: relative; min-height: 100vh;">
            <div style="position: fixed; top: 32px; left: 48px; z-index: 100;">
                <h1 style="font-size: 24px; margin: 0; background: linear-gradient(135deg, #a78bfa, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent;">NEURO</h1>
            </div>
            
            <div style="position: fixed; top: 32px; right: 48px; display: flex; gap: 16px; z-index: 100;">
                <button class="btn-outline" id="loginNavBtn" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 24px; border-radius: 40px; cursor: pointer;">Войти</button>
                <button class="btn-primary" id="registerNavBtn" style="background: linear-gradient(135deg, #a78bfa, #7c3aed); border: none; color: white; padding: 10px 24px; border-radius: 40px; cursor: pointer;">Начать</button>
            </div>
            
            <div class="card" style="text-align: center;">
                <h2><span style="background: linear-gradient(135deg, #a78bfa, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent;">Твоё настроение.</span></h2>
                <h2><span style="background: linear-gradient(135deg, #a78bfa, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent;">Твоя музыка.</span></h2>
                <h2><span style="background: linear-gradient(135deg, #a78bfa, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent;">Твой NEURO.</span></h2>
                <p style="margin-top: 32px;">Опиши свой день – и <strong>NEURO</strong> создаст идеальный плейлист для этого момента.</p>
                <button class="btn" id="startBtn">Создать мой плейлист →</button>
                <div class="features">
                <div class="feature-item">🎵 AI-подборка</div>
                <div class="feature-item">❤️ Чувствует настроение</div>
                <div class="feature-item">⚡ Мгновенный результат</div>
                </div>
            </div>
            `;
            
            const startBtn = page.querySelector('#startBtn');
            const loginNavBtn = page.querySelector('#loginNavBtn');
            const registerNavBtn = page.querySelector('#registerNavBtn');

            if (startBtn) startBtn.addEventListener('click', () => this.showPage('register'));
            if (loginNavBtn) loginNavBtn.addEventListener('click', () => this.showPage('login'));
            if (registerNavBtn) registerNavBtn.addEventListener('click', () => this.showPage('register'));

            return page;
        }

        createRegisterPage() {
            const page = document.createElement('div');
            page.className = 'page';
            page.id = 'register';
            
            page.innerHTML = `
            <div class="card">
                <div class="nav-links">
                <span class="back-link" data-back>← Назад</span>
                <span style="font-weight: bold;">NEURO</span>
                <span style="width: 80px;"></span>
                </div>
                <h2 style="text-align: center; margin-bottom: 32px;">Создать аккаунт</h2>
                <div class="input-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
                </div>
                <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="••••••••">
                </div>
                <button class="btn" id="registerBtn">Создать аккаунт</button>
                <button class="btn btn-secondary" id="gotoLoginBtn">Уже есть аккаунт? Войти</button>
            </div>
            `;
            
            page.querySelector('[data-back]').addEventListener('click', () => this.showPage('landing'));
            page.querySelector('#registerBtn').addEventListener('click', () => this.register());
            page.querySelector('#gotoLoginBtn').addEventListener('click', () => this.showPage('login'));
            
            return page;
        }

        createLoginPage() {
            const page = document.createElement('div');
            page.className = 'page';
            page.id = 'login';
            
            page.innerHTML = `
            <div class="card">
                <div class="nav-links">
                <span class="back-link" data-back>← Назад</span>
                <span style="font-weight: bold;">NEURO</span>
                <span style="width: 80px;"></span>
                </div>
                <h2 style="text-align: center; margin-bottom: 32px;">Добро пожаловать!</h2>
                <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn" id="loginBtn">Войти</button>
                <button class="btn btn-secondary" id="gotoRegisterBtn">Нет аккаунта? Зарегистрироваться</button>
            </div>
            `;
            
            page.querySelector('[data-back]').addEventListener('click', () => this.showPage('landing'));
            page.querySelector('#loginBtn').addEventListener('click', () => this.login());
            page.querySelector('#gotoRegisterBtn').addEventListener('click', () => this.showPage('register'));
            
            return page;
        }

        createPlaylistPage() {
            const page = document.createElement('div');
            page.className = 'page';
            page.id = 'create';

            page.innerHTML = `
            <div class="card">
                <div class="nav-links">
                <span class="back-link" data-back>← Назад</span>
                <span style="font-weight: bold;">NEURO</span>
                <span style="width: 80px;"></span>
                </div>
                <div style="position: fixed; top: 32px; right: 48px; z-index: 100;">
                <p style="color: #a78bfa;" id="usernameDisplay">Гость →</p>
                </div>
                <h2 style="text-align: center; margin-bottom: 32px;">Как прошёл твой день?</h2>
                <h3 style="text-align: center; margin-bottom: 32px; color: #c4b5fd;">Расскажи NEURO, как ты себя чувствуешь</h3>
                <div class="input-group">
                <textarea id="moodInput" placeholder="Опиши своё настроение, что произошло сегодня, как ты себя ощущаешь прямо сейчас..."></textarea>
                </div>
                <button class="btn" id="generatePlaylistBtn">Создать мой плейлист →</button>
                <div id="playlistResult" style="margin-top: 16px;"></div>
            </div>
            `;

            page.querySelector('[data-back]').addEventListener('click', () => this.showPage('landing'));
            page.querySelector('#generatePlaylistBtn').addEventListener('click', () => this.generatePlaylist());

            return page;
        }

        showPage(pageId) {
            // Анимация переключения страниц
            Object.keys(this.pages).forEach(id => {
            if (id === pageId) {
                this.pages[id].classList.add('active');
                this.animatePageContent(this.pages[id]);
            } else {
                this.pages[id].classList.remove('active');
            }
            });
        }

        animatePageContent(page) {
            const elements = page.querySelectorAll('h1, h2, h3, p, .input-group, .btn, .feature-item');
            elements.forEach((el, index) => {
            el.style.animation = 'none';
            el.offsetHeight;
            if (el.classList.contains('input-group')) {
                el.style.animation = `slideInLeft 0.5s ease ${index * 0.05}s both`;
            } else if (el.classList.contains('feature-item')) {
                el.style.animation = `scaleIn 0.5s ease ${index * 0.1}s both`;
            } else {
                el.style.animation = `fadeInUp 0.6s ease ${index * 0.05}s both`;
            }
            });
        }

        register() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            
            if (!email || !password) {
            this.showNotification('Пожалуйста, заполните все поля', 'error');
            return;
            }
            
            this.animateButton(document.getElementById('registerBtn'));
            
            localStorage.setItem('user', JSON.stringify({ email, password }));
            this.showNotification('Аккаунт успешно создан!', 'success');
            
            setTimeout(() => {
            this.showPage('login');
            }, 1000);
        }

        login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const savedUser = JSON.parse(localStorage.getItem('user'));
            
            if (!email || !password) {
            this.showNotification('Пожалуйста, заполните все поля', 'error');
            return;
            }
            
            if (savedUser && savedUser.email === email && savedUser.password === password) {
            this.currentUser = { email, name: email.split('@')[0] };
            this.animateButton(document.getElementById('loginBtn'));
            
            this.showNotification(`Добро пожаловать, ${this.currentUser.name}!`, 'success');
            
            setTimeout(() => {
                const usernameDisplay = document.getElementById('usernameDisplay');
                if (usernameDisplay) {
                usernameDisplay.textContent = `${this.currentUser.name} →`;
                }
                this.showPage('create');
            }, 1000);
            } else {
            this.showNotification('Неверный email или пароль', 'error');
            }
        }

        generatePlaylist() {
            const mood = document.getElementById('moodInput').value;

            if (!mood.trim()) {
            this.showNotification('Пожалуйста, опиши своё настроение', 'error');
            return;
            }

            this.animateButton(document.getElementById('generatePlaylistBtn'));
            this.showNotification('Спасибо! Твоё настроение сохранено', 'success');

            document.getElementById('moodInput').value = '';
        }

        animateButton(btn) {
            btn.style.animation = 'pulse 0.3s ease';
            setTimeout(() => {
            btn.style.animation = '';
            }, 300);
        }
        
        showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: ${type === 'success' ? '#10b981' : '#ef4444'};
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            z-index: 10000;
            animation: slideInLeft 0.3s ease;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
            notification.style.animation = 'fadeInUp 0.3s ease reverse';
            setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        }

        // Запуск приложения
        const app = new NeuroApp();
    </script>
</body>
</html>
